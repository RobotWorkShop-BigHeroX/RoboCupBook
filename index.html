<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RoboCup HSL 新人入门手册 | BigHeroX 战队</title>
  <meta name="description" content="面向 RoboCup 及人形机器人足球联赛 (HSL) 零基础新成员的权威入门指引与知识工程体系 - 湖南大学 Robot 工作坊 BigHeroX 战队">
  <link rel="icon" type="image/jpeg" href="public-resource/ima/BigHeroX.jpg">

  <!-- 字体资源 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- 核心库: 代码高亮、Markdown 解析、Mermaid 矢量图表渲染 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>

  <style>
    :root {
      --bg-primary: #0a0e17;
      --bg-secondary: #111827;
      --bg-tertiary: #1a2333;
      --bg-glass: rgba(10, 14, 23, 0.88);
      --border-color: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.16);
      --border-focus: #2563eb;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --accent-blue: #2563eb;
      --accent-blue-hover: #1d4ed8;
      --accent-cyan: #06b6d4;
      --accent-red: #ef4444;
      --accent-green: #10b981;
      --card-bg: rgba(17, 24, 39, 0.6);
      --sidebar-width: 290px;
      --toc-width: 240px;
      --header-height: 64px;
      --code-bg: #141c2c;
    }

    [data-theme="light"] {
      --bg-primary: #f8fafc;
      --bg-secondary: #ffffff;
      --bg-tertiary: #f1f5f9;
      --bg-glass: rgba(255, 255, 255, 0.92);
      --border-color: rgba(0, 0, 0, 0.08);
      --border-hover: rgba(0, 0, 0, 0.16);
      --border-focus: #2563eb;
      --text-main: #0f172a;
      --text-muted: #475569;
      --text-dim: #94a3b8;
      --card-bg: #ffffff;
      --code-bg: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans SC', sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      line-height: 1.75;
      overflow-x: hidden;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    /* 顶部滚动进度指示条 */
    #progress-bar {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      background: linear-gradient(90deg, #2563eb, #06b6d4, #10b981);
      width: 0%;
      z-index: 1000;
      transition: width 0.1s ease-out;
    }

    /* 顶部导航栏 */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--header-height);
      background: var(--bg-glass);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 900;
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
    }

    .brand-logos {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-logos img {
      width: 34px;
      height: 34px;
      border-radius: 6px;
      object-fit: cover;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
    }

    .brand-text {
      display: flex;
      flex-direction: column;
    }

    .brand-title {
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: -0.02em;
      color: var(--text-main);
    }

    .brand-badge {
      font-size: 0.72rem;
      color: var(--accent-cyan);
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* 搜索栏样式 */
    .search-wrapper {
      position: relative;
    }

    .search-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-box input {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 7px 12px 7px 32px;
      border-radius: 8px;
      font-size: 0.85rem;
      outline: none;
      width: 210px;
      transition: all 0.2s ease;
    }

    .search-box input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.18);
      width: 270px;
    }

    .search-icon {
      position: absolute;
      left: 10px;
      width: 14px;
      height: 14px;
      fill: var(--text-muted);
      pointer-events: none;
    }

    /* 搜索结果弹出面板 */
    .search-dropdown {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      width: 380px;
      max-height: 420px;
      overflow-y: auto;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
      padding: 8px;
      display: none;
      z-index: 1000;
    }

    .search-dropdown.open {
      display: block;
    }

    .search-result-item {
      padding: 10px 12px;
      border-radius: 6px;
      cursor: pointer;
      border-bottom: 1px solid var(--border-color);
      transition: background 0.15s ease;
    }

    .search-result-item:last-child {
      border-bottom: none;
    }

    .search-result-item:hover,
    .search-result-item.selected-nav {
      background: var(--bg-tertiary);
    }

    .search-result-item.selected-nav {
      outline: 1px solid var(--border-focus);
    }

    .search-res-chapter {
      font-size: 0.72rem;
      color: var(--accent-cyan);
      font-weight: 600;
      margin-bottom: 2px;
    }

    .search-res-heading {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .search-res-snippet {
      font-size: 0.78rem;
      color: var(--text-muted);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .search-highlight {
      background: rgba(37, 99, 235, 0.28);
      color: #93c5fd;
      padding: 0 2px;
      border-radius: 2px;
    }

    .btn-pdf {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent-blue);
      color: white;
      font-size: 0.84rem;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 8px;
      text-decoration: none;
      transition: background 0.15s ease, transform 0.15s ease;
    }

    .btn-pdf:hover {
      background: var(--accent-blue-hover);
      transform: translateY(-1px);
    }

    .icon-btn {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .icon-btn:hover {
      color: var(--text-main);
      border-color: var(--border-hover);
    }

    .menu-toggle {
      display: none;
    }

    /* 主布局 */
    .app-layout {
      display: flex;
      margin-top: var(--header-height);
      min-height: calc(100vh - var(--header-height));
    }

    /* 左侧边栏导航 */
    .sidebar {
      width: var(--sidebar-width);
      position: fixed;
      top: var(--header-height);
      bottom: 0;
      left: 0;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border-color);
      overflow-y: auto;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 800;
    }

    .sidebar-section-title {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-dim);
      font-weight: 700;
      padding: 10px 12px 4px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 8px;
      text-decoration: none;
      color: var(--text-muted);
      font-size: 0.88rem;
      font-weight: 500;
      transition: all 0.15s ease;
      cursor: pointer;
    }

    .nav-item:hover {
      color: var(--text-main);
      background: var(--bg-tertiary);
    }

    .nav-item.active {
      color: white;
      background: var(--accent-blue);
      font-weight: 600;
    }

    .nav-num {
      display: inline-block;
      width: 22px;
      height: 22px;
      line-height: 22px;
      text-align: center;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.08);
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--accent-cyan);
    }

    .nav-item.active .nav-num {
      background: rgba(255, 255, 255, 0.22);
      color: white;
    }

    .sidebar-footer {
      margin-top: auto;
      padding-top: 16px;
      border-top: 1px solid var(--border-color);
      font-size: 0.78rem;
      color: var(--text-dim);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    /* 正文主体区域 (行长 < 80 字符，保障阅读舒适度) */
    .content-wrapper {
      margin-left: var(--sidebar-width);
      flex: 1;
      padding: 40px 52px;
      max-width: 860px;
      min-width: 0;
    }

    /* 右侧大纲 (TOC) */
    .toc-sidebar {
      width: var(--toc-width);
      position: fixed;
      top: calc(var(--header-height) + 40px);
      right: 28px;
      max-height: calc(100vh - var(--header-height) - 60px);
      overflow-y: auto;
      padding-left: 16px;
      border-left: 1px solid var(--border-color);
      font-size: 0.82rem;
    }

    .toc-title {
      font-size: 0.72rem;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--text-dim);
      margin-bottom: 12px;
      letter-spacing: 0.06em;
    }

    .toc-link {
      display: block;
      color: var(--text-muted);
      text-decoration: none;
      padding: 5px 0 5px 8px;
      line-height: 1.45;
      transition: all 0.15s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border-left: 2px solid transparent;
      margin-left: -17px;
    }

    .toc-link:hover {
      color: var(--text-main);
    }

    .toc-link.active {
      color: var(--accent-cyan);
      font-weight: 600;
      border-left-color: var(--accent-cyan);
      background: rgba(6, 182, 212, 0.06);
    }

    .toc-link.depth-3 {
      padding-left: 18px;
      font-size: 0.78rem;
    }

    /* Markdown 渲染美化样式 */
    .markdown-body h1 {
      font-size: 2.1rem;
      font-weight: 800;
      margin-bottom: 1.2rem;
      letter-spacing: -0.02em;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.6rem;
      color: var(--text-main);
    }

    .markdown-body h2 {
      font-size: 1.45rem;
      font-weight: 700;
      margin-top: 2.2rem;
      margin-bottom: 0.8rem;
      letter-spacing: -0.01em;
      border-bottom: 1px dashed var(--border-color);
      padding-bottom: 0.4rem;
      color: var(--text-main);
    }

    .markdown-body h3 {
      font-size: 1.15rem;
      font-weight: 600;
      margin-top: 1.6rem;
      margin-bottom: 0.6rem;
      color: var(--accent-cyan);
    }

    .markdown-body p {
      margin-bottom: 1.15rem;
      color: var(--text-main);
    }

    .markdown-body ul, .markdown-body ol {
      margin-bottom: 1.25rem;
      padding-left: 1.5rem;
    }

    .markdown-body li {
      margin-bottom: 0.45rem;
    }

    .markdown-body blockquote {
      border-left: 3px solid var(--accent-blue);
      background: var(--card-bg);
      padding: 12px 18px;
      border-radius: 0 8px 8px 0;
      margin-bottom: 1.4rem;
      color: var(--text-muted);
    }

    /* Alert 提示框样式 */
    .alert-box {
      border-radius: 8px;
      padding: 14px 18px;
      margin-bottom: 1.4rem;
      border-left: 4px solid;
    }
    .alert-note { background: rgba(37, 99, 235, 0.08); border-color: #2563eb; }
    .alert-tip { background: rgba(16, 185, 129, 0.08); border-color: #10b981; }
    .alert-important { background: rgba(168, 85, 247, 0.08); border-color: #a855f7; }
    .alert-warning { background: rgba(245, 158, 11, 0.08); border-color: #f59e0b; }
    .alert-caution { background: rgba(239, 68, 68, 0.08); border-color: #ef4444; }

    /* 代码块与复制按钮 */
    .code-container {
      position: relative;
      margin-bottom: 1.4rem;
    }

    .markdown-body pre {
      background: var(--code-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 14px 18px;
      overflow-x: auto;
      font-family: 'Fira Code', monospace;
      font-size: 0.88rem;
      line-height: 1.6;
    }

    .copy-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 0.72rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
      opacity: 0.6;
    }

    .code-container:hover .copy-btn {
      opacity: 1;
    }

    .copy-btn:hover {
      background: var(--accent-blue);
      color: white;
      border-color: var(--accent-blue);
    }

    .markdown-body code {
      font-family: 'Fira Code', monospace;
      background: var(--code-bg);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.85em;
      color: #93c5fd;
    }

    .markdown-body pre code {
      padding: 0;
      background: transparent;
      color: inherit;
    }

    /* Mermaid 图表渲染容器 */
    .mermaid-container {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
      margin: 1.5rem 0;
      display: flex;
      justify-content: center;
      overflow-x: auto;
    }

    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 1.5rem;
      font-size: 0.88rem;
    }

    .markdown-body th, .markdown-body td {
      border: 1px solid var(--border-color);
      padding: 9px 14px;
      text-align: left;
    }

    .markdown-body th {
      background: var(--bg-tertiary);
      font-weight: 600;
      color: var(--accent-cyan);
    }

    .markdown-body tr:nth-child(even) {
      background: rgba(255, 255, 255, 0.02);
    }

    .markdown-body a {
      color: var(--accent-blue);
      text-decoration: none;
      border-bottom: 1px dashed rgba(37, 99, 235, 0.4);
      transition: border-bottom-color 0.15s;
    }

    .markdown-body a:hover {
      border-bottom-color: var(--accent-blue);
    }

    /* 翻页导航 */
    .pager-container {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-top: 50px;
      padding-top: 24px;
      border-top: 1px solid var(--border-color);
    }

    .pager-btn {
      display: flex;
      flex-direction: column;
      padding: 14px 20px;
      border: 1px solid var(--border-color);
      background: var(--bg-secondary);
      border-radius: 10px;
      text-decoration: none;
      color: var(--text-main);
      flex: 1;
      max-width: 320px;
      transition: all 0.15s ease;
      cursor: pointer;
    }

    .pager-btn:hover {
      border-color: var(--accent-blue);
      transform: translateY(-2px);
    }

    .pager-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      color: var(--text-dim);
      font-weight: 700;
    }

    .pager-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--accent-cyan);
    }

    .pager-btn.next {
      text-align: right;
      margin-left: auto;
    }

    /* 移动端响应式 */
    @media (max-width: 1180px) {
      .toc-sidebar {
        display: none;
      }
      .content-wrapper {
        margin-right: 0;
        max-width: 100%;
      }
    }

    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(-100%);
        transition: transform 0.25s ease;
      }
      .sidebar.open {
        transform: translateX(0);
      }
      .content-wrapper {
        margin-left: 0;
        padding: 24px 18px;
      }
      .menu-toggle {
        display: flex;
      }
      .search-box input {
        width: 140px;
      }
      .search-box input:focus {
        width: 180px;
      }
      .search-dropdown {
        width: 300px;
      }
    }
  </style>
</head>
<body>

  <div id="progress-bar"></div>

  <!-- 顶部 Header -->
  <header>
    <div style="display: flex; align-items: center; gap: 14px;">
      <button class="icon-btn menu-toggle" id="menu-btn" title="菜单">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
      </button>
      <a href="#readme" class="brand-container">

          <img src="public-resource/ima/BigHeroX.jpg" alt="BigHeroX">
        </div>

          <span class="brand-badge">Robot工作坊 · BigHeroX</span>

      </a>
    </div>

    <div class="header-actions">
      <div class="search-wrapper">
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24"><path d="M21.71 20.29l-5.4-5.4A8.93 8.93 0 0 0 18 10a9 9 0 1 0-9 9 8.93 8.93 0 0 0 4.89-1.31l5.4 5.4a1 1 0 0 0 1.42 0 1 1 0 0 0 0-1.4zM4 10a6 6 0 1 1 6 6 6 6 0 0 1-6-6z"/></svg>
          <input type="text" id="search-input" placeholder="搜索手册内容..." autocomplete="off">
        </div>
        <div class="search-dropdown" id="search-dropdown"></div>

      </a>
      <button class="icon-btn" id="theme-btn" title="切换暗黑/明亮主题">
        <svg id="theme-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
      </button>

    <!-- 主正文区域 -->
    <main class="content-wrapper">
      <article class="markdown-body" id="article-content">
        <div style="text-align: center; padding: 60px 0; color: var(--text-muted);">
          加载手册内容中...
        </div>

      <div class="pager-container" id="pager-container">
        <a class="pager-btn prev" id="pager-prev" style="display: none;">

        <a class="pager-btn next" id="pager-next" style="display: none;">

    <!-- 右侧 TOC 大纲 -->
    <aside class="toc-sidebar" id="toc-sidebar">
      <div class="toc-title">本页大纲</div>
      <div id="toc-content"></div>

  <script>
    // 章节路由列表
    const chapters = [
      { id: 'readme', doc: 'README.md', title: '手册概览与说明' },
      { id: '01-robocup-hsl-introduction', doc: 'docs/01-robocup-hsl-introduction.md', title: '1 RoboCup介绍与赛制' },
      { id: '02-teams-and-repositories', doc: 'docs/02-teams-and-repositories.md', title: '1.2 全球历史强队谱系' },
      { id: '03-bigherox-platform', doc: 'docs/03-bigherox-platform.md', title: '2 BigHeroX 平台资产' },
      { id: '04-learning-roadmap', doc: 'docs/04-learning-roadmap.md', title: '3 新成员学习路线图' },
      { id: '05-information-channels', doc: 'docs/05-information-channels.md', title: '4 官方消息与交流渠道' },
      { id: '06-safety-handbook', doc: 'docs/06-safety-handbook.md', title: '5 实验室操作安全守则' }
    ];

    let currentDocIndex = 0;
    const docCache = {};
    let isDark = true;
    let pendingHeadingTarget = null;
    let currentSearchResults = [];
    let selectedResultIndex = -1;

    // 读取持久化主题
    const savedTheme = localStorage.getItem('robocupbook-theme');
    if (savedTheme === 'light') {
      isDark = false;
      document.documentElement.setAttribute('data-theme', 'light');
    } else {
      isDark = true;
      document.documentElement.setAttribute('data-theme', 'dark');
    }

    function updateThemeIcon() {
      const iconEl = document.getElementById('theme-icon');
      if (!iconEl) return;
      if (isDark) {
        iconEl.innerHTML = '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>';
      } else {
        iconEl.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
      }
    }
    updateThemeIcon();

    // 初始化 Mermaid
    function initMermaid() {
      mermaid.initialize({
        startOnLoad: false,
        theme: isDark ? 'dark' : 'default',
        securityLevel: 'loose',
        fontFamily: "'Plus Jakarta Sans', 'Noto Sans SC', sans-serif"
      });
    }
    initMermaid();

    // 自定义 Marked 渲染器
    const renderer = new marked.Renderer();
    renderer.code = function(code, lang) {
      if (typeof code === 'object' && code !== null) {
        lang = code.lang;
        code = code.text;
      }
      if (lang === 'mermaid') {
        return `<div class="mermaid-container"><div class="mermaid">${code}</div></div>`;
      }
      const validLang = (lang && hljs.getLanguage(lang)) ? lang : 'plaintext';
      const highlighted = hljs.highlight(code || '', { language: validLang }).value;
      return `<div class="code-container">
        <button class="copy-btn" onclick="copyCode(this)">复制</button>
        <pre><code class="hljs ${validLang}">${highlighted}</code></pre>
      </div>`;
    };

    marked.setOptions({
      renderer: renderer,
      gfm: true,
      breaks: true
    });

    // 解析 Alert 语法 (> [!NOTE] 等)
    function transformAlerts(html) {
      return html
        .replace(/<blockquote>\s*<p>\s*\[!NOTE\]([\s\S]*?)<\/blockquote>/gi, '<div class="alert-box alert-note"><strong>ℹ️ 注意 (Note)</strong><p>$1</div>')
        .replace(/<blockquote>\s*<p>\s*\[!TIP\]([\s\S]*?)<\/blockquote>/gi, '<div class="alert-box alert-tip"><strong>💡 提示 (Tip)</strong><p>$1</div>')
        .replace(/<blockquote>\s*<p>\s*\[!IMPORTANT\]([\s\S]*?)<\/blockquote>/gi, '<div class="alert-box alert-important"><strong>📌 重点 (Important)</strong><p>$1</div>')
        .replace(/<blockquote>\s*<p>\s*\[!WARNING\]([\s\S]*?)<\/blockquote>/gi, '<div class="alert-box alert-warning"><strong>⚠️ 警告 (Warning)</strong><p>$1</div>')
        .replace(/<blockquote>\s*<p>\s*\[!CAUTION\]([\s\S]*?)<\/blockquote>/gi, '<div class="alert-box alert-caution"><strong>🛑 危险 (Caution)</strong><p>$1</div>');
    }

    // 代码复制函数
    window.copyCode = function(button) {
      const codeBlock = button.closest('.code-container').querySelector('code');
      const text = codeBlock.innerText;
      navigator.clipboard.writeText(text).then(() => {
        button.innerText = '已复制 ✓';
        setTimeout(() => { button.innerText = '复制'; }, 2000);
      });
    };

    // 平滑滚动至目标标题
    function scrollToTargetHeading(headingText) {
      if (!headingText) return;
      const cleanTarget = headingText.trim().replace(/^#+\s*/, '').toLowerCase();
      const headings = document.getElementById('article-content').querySelectorAll('h1, h2, h3, h4');
      for (const h of headings) {
        const text = h.textContent.trim().replace(/^#+\s*/, '').toLowerCase();
        if (text.includes(cleanTarget) || cleanTarget.includes(text)) {
          setTimeout(() => {
            h.scrollIntoView({ behavior: 'smooth' });
          }, 60);
          return;
        }
      }
    }

    // 加载文档
    async function loadDoc(index) {
      currentDocIndex = index;
      const target = chapters[index];
      const contentEl = document.getElementById('article-content');

      // 更新侧边栏高亮
      document.querySelectorAll('.nav-item').forEach((el, idx) => {
        el.classList.toggle('active', idx === index);
      });

      // 提取或缓存内容
      let markdownText = docCache[target.doc];
      if (!markdownText) {
        try {
          const resp = await fetch(target.doc);
          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
          markdownText = await resp.text();
          docCache[target.doc] = markdownText;
        } catch (err) {
          contentEl.innerHTML = `<div style="color: #ef4444; padding: 40px;"><h3>加载失败</h3><p>${err.message}</p></div>`;
          return;
        }
      }

      // 渲染 HTML
      const rawHtml = marked.parse(markdownText);
      contentEl.innerHTML = transformAlerts(rawHtml);

      // 渲染 Mermaid 图表
      const mermaidNodes = contentEl.querySelectorAll('.mermaid');
      if (mermaidNodes.length > 0) {
        try {
          await mermaid.run({ nodes: mermaidNodes });
        } catch (mErr) {
          console.error("Mermaid 渲染错误:", mErr);
        }
      }

      // 生成右侧目录
      buildTOC();

      // 更新翻页按钮
      updatePager();

      // 定位或滚动置顶
      if (pendingHeadingTarget) {
        scrollToTargetHeading(pendingHeadingTarget);
        pendingHeadingTarget = null;
      } else {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    // 生成本页目录与标题 ID
    function buildTOC() {
      const tocContainer = document.getElementById('toc-content');
      tocContainer.innerHTML = '';
      const headings = document.getElementById('article-content').querySelectorAll('h2, h3');

      headings.forEach((h, idx) => {
        const id = 'heading-' + idx;
        h.id = id;
        const link = document.createElement('a');
        link.className = 'toc-link ' + (h.tagName === 'H3' ? 'depth-3' : '');
        link.textContent = h.textContent.replace(/^#+\s*/, '');
        link.href = '#' + id;
        link.onclick = (e) => {
          e.preventDefault();
          h.scrollIntoView({ behavior: 'smooth' });
        };
        tocContainer.appendChild(link);
      });
      setupScrollSpy();
    }

    // 滚动感知高亮（ScrollSpy）
    function setupScrollSpy() {
      const links = document.querySelectorAll('.toc-link');
      const headings = document.querySelectorAll('.markdown-body h2, .markdown-body h3');
      if (headings.length === 0) return;

      window.addEventListener('scroll', () => {
        let activeIdx = 0;
        const scrollY = window.scrollY + 100;

        headings.forEach((h, idx) => {
          if (h.offsetTop <= scrollY) {
            activeIdx = idx;
          }
        });

        links.forEach((l, idx) => {
          l.classList.toggle('active', idx === activeIdx);
        });
      }, { passive: true });
    }

    // 翻页器
    function updatePager() {
      const prevBtn = document.getElementById('pager-prev');
      const nextBtn = document.getElementById('pager-next');

      if (currentDocIndex > 0) {
        prevBtn.style.display = 'flex';
        document.getElementById('pager-prev-title').textContent = chapters[currentDocIndex - 1].title;
        prevBtn.onclick = () => location.hash = chapters[currentDocIndex - 1].id;
      } else {
        prevBtn.style.display = 'none';
      }

      if (currentDocIndex < chapters.length - 1) {
        nextBtn.style.display = 'flex';
        document.getElementById('pager-next-title').textContent = chapters[currentDocIndex + 1].title;
        nextBtn.onclick = () => location.hash = chapters[currentDocIndex + 1].id;
      } else {
        nextBtn.style.display = 'none';
      }
    }

    // 全文即时搜索机制
    const searchInput = document.getElementById('search-input');
    const searchDropdown = document.getElementById('search-dropdown');

    async function ensureAllDocsCached() {
      for (const ch of chapters) {
        if (!docCache[ch.doc]) {
          try {
            const resp = await fetch(ch.doc);
            if (resp.ok) {
              docCache[ch.doc] = await resp.text();
            }
          } catch (e) {}
        }
      }
    }

    function updateSelectedResult(items) {
      items.forEach((item, idx) => {
        item.classList.toggle('selected-nav', idx === selectedResultIndex);
        if (idx === selectedResultIndex) {
          item.scrollIntoView({ block: 'nearest' });
        }
      });
    }

    searchInput.addEventListener('keydown', (e) => {
      const items = searchDropdown.querySelectorAll('.search-result-item');
      if (!searchDropdown.classList.contains('open') || items.length === 0) {
        if (e.key === 'Escape') {
          searchDropdown.classList.remove('open');
          searchInput.blur();
        }
        return;
      }

      if (e.key === 'ArrowDown') {
        e.preventDefault();
        selectedResultIndex = (selectedResultIndex + 1) % items.length;
        updateSelectedResult(items);
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        selectedResultIndex = (selectedResultIndex - 1 + items.length) % items.length;
        updateSelectedResult(items);
      } else if (e.key === 'Enter') {
        e.preventDefault();
        if (selectedResultIndex >= 0 && selectedResultIndex < items.length) {
          items[selectedResultIndex].click();
        }
      } else if (e.key === 'Escape') {
        e.preventDefault();
        searchDropdown.classList.remove('open');
        searchInput.blur();
      }
    });

    searchInput.addEventListener('input', async (e) => {
      const query = e.target.value.trim().toLowerCase();
      selectedResultIndex = -1;

      if (!query) {
        searchDropdown.classList.remove('open');
        searchDropdown.innerHTML = '';
        currentSearchResults = [];
        return;
      }

      await ensureAllDocsCached();
      const results = [];

      chapters.forEach((ch, chIdx) => {
        const text = docCache[ch.doc] || '';
        const lines = text.split('\n');
        let currentHeading = ch.title;

        lines.forEach(line => {
          if (line.startsWith('#')) {
            currentHeading = line.replace(/^#+\s*/, '');
          }
          const lowerLine = line.toLowerCase();
          const matchIdx = lowerLine.indexOf(query);
          if (matchIdx !== -1) {
            const start = Math.max(0, matchIdx - 20);
            const end = Math.min(line.length, matchIdx + query.length + 40);
            const snippet = line.substring(start, end);
            results.push({
              chIndex: chIdx,
              chId: ch.id,
              chapter: ch.title,
              heading: currentHeading,
              snippet: snippet,
              query: query
            });
          }
        });
      });

      if (results.length === 0) {
        currentSearchResults = [];
        searchDropdown.innerHTML = `<div style="padding: 16px; text-align: center; color: var(--text-dim); font-size: 0.82rem;">未找到与 "${query}" 匹配的内容</div>`;
        searchDropdown.classList.add('open');
        return;
      }

      const topResults = results.slice(0, 8);
      currentSearchResults = topResults;
      searchDropdown.innerHTML = topResults.map((res, rIdx) => {
        const highlighted = res.snippet.replace(new RegExp(`(${res.query})`, 'gi'), '<span class="search-highlight">$1</span>');
        return `<div class="search-result-item" data-index="${rIdx}">
          <div class="search-res-chapter">${res.chapter}</div>
          <div class="search-res-heading">${res.heading}</div>
          <div class="search-res-snippet">${highlighted}</div>
        </div>`;
      }).join('');
      searchDropdown.classList.add('open');
    });

    searchDropdown.addEventListener('click', (e) => {
      const item = e.target.closest('.search-result-item');
      if (!item) return;
      const idx = parseInt(item.getAttribute('data-index'), 10);
      const res = currentSearchResults[idx];
      if (res) {
        selectSearchResult(res.chIndex, res.chId, res.heading);
      }
    });

    window.selectSearchResult = function(chIndex, chId, headingText) {
      searchDropdown.classList.remove('open');
      searchInput.value = '';
      pendingHeadingTarget = headingText;
      if (location.hash === '#' + chId) {
        scrollToTargetHeading(headingText);
        pendingHeadingTarget = null;
      } else {
        location.hash = chId;
      }
    };

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.search-wrapper')) {
        searchDropdown.classList.remove('open');
      }
    });

    // 路由监听
    function handleRoute() {
      const hash = location.hash.replace('#', '') || 'readme';
      const idx = chapters.findIndex(c => c.id === hash);
      if (idx !== -1) {
        loadDoc(idx);
      } else {
        loadDoc(0);
      }
    }

    window.addEventListener('hashchange', handleRoute);
    window.addEventListener('load', handleRoute);

    // 滚动进度指示
    window.addEventListener('scroll', () => {
      const totalScroll = document.documentElement.scrollHeight - window.innerHeight;
      const progress = totalScroll > 0 ? (window.scrollY / totalScroll) * 100 : 0;
      document.getElementById('progress-bar').style.width = Math.min(100, Math.max(0, progress)) + '%';
    });

    // 移动端抽屉开关
    const menuBtn = document.getElementById('menu-btn');
    const sidebar = document.getElementById('sidebar');
    menuBtn.onclick = () => sidebar.classList.toggle('open');
    document.querySelector('.content-wrapper').onclick = () => sidebar.classList.remove('open');

    // 主题切换
    const themeBtn = document.getElementById('theme-btn');
    themeBtn.onclick = () => {
      isDark = !isDark;
      const themeName = isDark ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', themeName);
      localStorage.setItem('robocupbook-theme', themeName);
      updateThemeIcon();
      initMermaid();
      loadDoc(currentDocIndex);
    };
  </script>
